<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CC" />
      <stop offset="100%" stop-color="#FCE4D6" />
    </linearGradient>
    <linearGradient id="hat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
  </defs>
  <rect width="220" height="220" rx="30" fill="url(#bg)" />
  <!-- Hard Hat -->
  <path d="M 60 115 A 50 50 0 0 1 160 115 Z" fill="url(#hat)" />
  <rect x="45" y="112" width="130" height="8" rx="4" fill="#FF8C00" />
  <rect x="95" y="60" width="30" height="15" rx="5" fill="#FFD700" />
  <!-- Blueprint (Rolled) -->
  <rect x="60" y="145" width="80" height="25" rx="6" fill="#4D96FF" stroke="#3A7BD5" stroke-width="2" />
  <line x1="75" y1="145" x2="75" y2="170" stroke="#FFFFFF" stroke-width="2" />
  <line x1="125" y1="145" x2="125" y2="170" stroke="#FFFFFF" stroke-width="2" />
  <!-- Wrench -->
  <path d="M 140 135 L 170 165" stroke="#999999" stroke-width="8" stroke-linecap="round" />
  <circle cx="140" cy="135" r="10" fill="#999999" />
  <circle cx="140" cy="135" r="5" fill="#FFF2CC" />
</svg>
