<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE6F2" />
      <stop offset="100%" stop-color="#FFCCE6" />
    </linearGradient>
  </defs>
  <rect width="220" height="220" rx="30" fill="url(#bg)" />
  <!-- Ring Light -->
  <circle cx="110" cy="100" r="55" fill="none" stroke="#FFFFFF" stroke-width="12" filter="drop-shadow(0px 0px 8px #FF4D94)" />
  <!-- Camera -->
  <rect x="75" y="80" width="70" height="45" rx="8" fill="#333333" />
  <circle cx="110" cy="102" r="16" fill="#1A1A1A" />
  <circle cx="110" cy="102" r="12" fill="#4D96FF" opacity="0.7" />
  <circle cx="110" cy="102" r="6" fill="#000000" />
  <!-- Flash/Record dot -->
  <circle cx="90" cy="92" r="4" fill="#FF3333" />
  <!-- Play Sign on Screen -->
  <path d="M 128 88 L 138 93 L 128 98 Z" fill="#FF3333" />
  <!-- Tripod -->
  <line x1="110" y1="125" x2="110" y2="170" stroke="#333" stroke-width="8" />
  <line x1="110" y1="150" x2="80" y2="190" stroke="#333" stroke-width="6" />
  <line x1="110" y1="150" x2="140" y2="190" stroke="#333" stroke-width="6" />
</svg>
