<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Fun 8 互動式英文朗讀與學習網頁</title>
  <!-- Google Fonts: Fredoka for rounded English, Noto Sans TC for Traditional Chinese -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* === Design System Tokens (Neobrutalism Style) === */
    :root {
      --bg-color: #FAF8F5; /* Warm chalk */
      --text-color: #2D312E; /* Charcoal dark */
      --border-color: #2D312E;
      --border-width: 3px;
      
      /* Pastel Palette */
      --color-primary: #FFB5B5;   /* Pastel Pink (Lesson 1) */
      --color-success: #A8E6CF;   /* Pastel Mint (Review 1) */
      --color-warning: #FFD3B6;   /* Pastel Orange (Lesson 2) */
      --color-info: #BDE0FE;      /* Pastel Blue (Review 2) */
      --color-accent: #FDFFB6;    /* Pastel Yellow (Highlight / Fun Facts) */
      --color-white: #FFFFFF;
      --color-muted: #6B7280;     /* Muted grey */
      
      --shadow-offset: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 50px;
    }

    /* === Header Layout === */
    header {
      background-color: var(--color-white);
      border-bottom: var(--border-width) solid var(--border-color);
      padding: 20px 30px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 0px rgba(0, 0, 0, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      background-color: var(--color-accent);
      border: 2px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0px var(--border-color);
      font-size: 24px;
    }

    .brand-text h1 {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
    }

    .brand-text p {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-muted);
    }

    /* === Speed Controller inside Header === */
    .header-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .speed-control-container {
      background-color: #FFFDF6;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .speed-control-container label {
      font-size: 14px;
      font-weight: 800;
    }

    .speed-slider {
      width: 100px;
      cursor: pointer;
      accent-color: var(--text-color);
    }

    .speed-value {
      font-size: 14px;
      font-weight: 800;
      min-width: 45px;
      text-align: center;
    }

    /* === Main Container === */
    .container {
      max-width: 1200px;
      width: 92%;
      margin: 30px auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 30px;
      flex: 1;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* === Left Column: Tabs and content === */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* Tabs Navigation (6 tabs) */
    .tabs-nav {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    @media (max-width: 768px) {
      .tabs-nav {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 480px) {
      .tabs-nav {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .tab-btn {
      padding: 12px 6px;
      font-size: 14px;
      font-weight: 800;
      border: var(--border-width) solid var(--border-color);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--border-color);
      transition: all 0.15s ease;
      background-color: var(--color-white);
      text-align: center;
    }

    .tab-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--border-color);
    }

    .tab-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .tab-btn[data-tab="lesson1"].active { background-color: var(--color-primary); }
    .tab-btn[data-tab="funfact1"].active { background-color: var(--color-accent); }
    .tab-btn[data-tab="review1"].active { background-color: var(--color-success); }
    .tab-btn[data-tab="lesson2"].active { background-color: var(--color-warning); }
    .tab-btn[data-tab="funfact2"].active { background-color: var(--color-accent); }
    .tab-btn[data-tab="review2"].active { background-color: var(--color-info); }

    /* Reader Panel Card */
    .reader-card {
      background-color: var(--color-white);
      border: var(--border-width) solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .reader-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #E2E8F0;
      padding-bottom: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .lesson-title {
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Global Player Controls */
    .player-controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      font-weight: 800;
      font-size: 14px;
      padding: 8px 16px;
      background-color: var(--color-white);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.1s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 3px 3px 0px var(--border-color);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 0px var(--border-color);
    }

    .btn-play { background-color: var(--color-success); }
    .btn-pause { background-color: var(--color-warning); }
    .btn-stop { background-color: var(--color-primary); }

    /* Paragraph Block styling */
    .paragraph-card {
      border: 2px solid var(--border-color);
      border-radius: 18px;
      padding: 20px;
      background-color: #FFFDFB;
      box-shadow: 3px 3px 0px var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .english-para {
      font-size: 19px;
      line-height: 1.8;
      font-weight: 600;
      color: #333;
    }

    .chinese-para {
      font-size: 15px;
      line-height: 1.6;
      font-weight: 600;
      color: #556B2F; /* Dark olive green for translations */
      background-color: #F3F8F2;
      border-radius: 12px;
      padding: 12px 16px;
      border-left: 4px solid var(--color-success);
    }

    /* Sentence wrapper & highlighting */
    .sentence-block {
      position: relative;
      border-radius: 6px;
      padding: 1px 4px;
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
      display: inline;
    }

    .sentence-block.active-sentence {
      background-color: var(--color-accent);
      box-shadow: 0 0 0 2px var(--color-accent);
      color: #000;
    }

    .play-sentence-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-right: 4px;
      font-size: 14px;
      opacity: 0.4;
      transition: opacity 0.2s;
      vertical-align: middle;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 1px 3px;
      background-color: #fff;
    }

    .sentence-block:hover .play-sentence-icon {
      opacity: 1;
    }

    /* Interactive individual words */
    .word {
      cursor: pointer;
      display: inline-block;
      position: relative;
      border-bottom: 2px dashed transparent;
      transition: all 0.15s ease;
      user-select: none;
      padding: 0 1px;
    }

    .word:hover {
      background-color: #EBF4FF;
      border-bottom: 2px dashed #3B82F6;
      transform: translateY(-1px);
    }

    .word.selected-word {
      background-color: var(--color-info) !important;
      border-bottom: 2px solid #3B82F6;
      font-weight: 700;
    }

    /* === Right Column: Sticky Vocabulary Look-up Panel === */
    .sidebar {
      position: relative;
    }

    .lookup-panel {
      position: sticky;
      top: 110px;
      background-color: var(--color-white);
      border: var(--border-width) solid var(--border-color);
      border-radius: 22px;
      padding: 24px;
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
      transition: all 0.3s ease;
    }

    .lookup-panel.empty {
      border-style: dashed;
      background-color: #FAF9F6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--color-muted);
      min-height: 250px;
    }

    .lookup-panel.empty .bulb-icon {
      font-size: 44px;
      margin-bottom: 15px;
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .lookup-details {
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .lookup-details.active {
      display: flex;
    }

    .lookup-word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    .lookup-word {
      font-size: 26px;
      font-weight: 900;
    }

    .pronounce-word-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background-color: var(--color-accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 2px 2px 0px var(--border-color);
      transition: all 0.1s;
    }

    .pronounce-word-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border-color);
    }

    .pronounce-word-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border-color);
    }

    .lookup-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .lookup-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lookup-value {
      font-size: 16px;
      font-weight: 700;
    }

    .lookup-ipa {
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      color: #3B82F6;
      background-color: #EFF6FF;
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-block;
      width: fit-content;
      border: 1px solid #BFDBFE;
    }

    .lookup-pos {
      font-size: 14px;
      color: #D97706;
      background-color: #FEF3C7;
      padding: 3px 8px;
      border-radius: 8px;
      display: inline-block;
      width: fit-content;
      font-weight: 700;
      border: 1px solid #FDE68A;
    }

    .lookup-translation {
      font-size: 22px;
      font-weight: 900;
      color: #10B981;
      background-color: #ECFDF5;
      padding: 10px 15px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .close-lookup-btn {
      margin-top: 15px;
      width: 100%;
      text-align: center;
      background-color: #F3F4F6;
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px var(--border-color);
    }

    /* Mobile Bottom Drawer for Lookup */
    @media (max-width: 900px) {
      .lookup-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        top: auto;
        z-index: 1000;
        border-radius: 24px 24px 0 0;
        border-bottom: none;
        box-shadow: 0px -8px 20px rgba(0,0,0,0.1), 0px -3px 0px var(--border-color);
        transform: translateY(105%);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        max-height: 80vh;
        overflow-y: auto;
      }

      .lookup-panel.mobile-active {
        transform: translateY(0);
      }

      /* Backdrop Overlay for mobile drawer */
      .backdrop {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0,0,0,0.4);
        z-index: 999;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .backdrop.active {
        display: block;
        opacity: 1;
      }
    }

    /* Footer styling */
    footer {
      text-align: center;
      font-size: 13px;
      color: var(--color-muted);
      margin-top: auto;
      padding-top: 30px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <!-- Mobile Backdrop -->
  <div class="backdrop" id="backdrop" onclick="closeLookupPanel()"></div>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">📚</div>
      <div class="brand-text">
        <h1>Super Fun 8</h1>
        <p>互動式課文朗讀與翻譯工具</p>
      </div>
    </div>
    
    <div class="header-controls">
      <a href="../index.html" style="text-decoration: none; font-weight: 700; background-color: var(--color-success); border: 2.5px solid var(--border-color); padding: 8px 15px; border-radius: 12px; box-shadow: 2px 2px 0px var(--border-color); font-size: 14px; color: var(--text-color); display: flex; align-items: center; gap: 5px; margin-right: 15px;">
        🏠 返回傳送門
      </a>
      <!-- Speed Slider -->
      <div class="speed-control-container">
        <label for="speed-slider">語速 :</label>
        <input type="range" id="speed-slider" class="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateSpeedLabel(this.value)">
        <span class="speed-value" id="speed-label">1.0x</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Left Area: Main Content -->
    <section class="main-content">
      <!-- Tabs Navigation -->
      <nav class="tabs-nav">
        <button class="tab-btn active" data-tab="lesson1" onclick="switchTab('lesson1')">Lesson 1 🐕</button>
        <button class="tab-btn" data-tab="funfact1" onclick="switchTab('funfact1')">Fun Fact 1 🌐</button>
        <button class="tab-btn" data-tab="review1" onclick="switchTab('review1')">Review 1 💬</button>
        <button class="tab-btn" data-tab="lesson2" onclick="switchTab('lesson2')">Lesson 2 🚀</button>
        <button class="tab-btn" data-tab="funfact2" onclick="switchTab('funfact2')">Fun Fact 2 👑</button>
        <button class="tab-btn" data-tab="review2" onclick="switchTab('review2')">Review 2 👨‍🚒</button>
      </nav>

      <!-- Reader Panel -->
      <article class="reader-card">
        <div class="reader-header">
          <h2 class="lesson-title" id="lesson-title-display">
            <!-- Dynamically populated -->
          </h2>
          <div class="player-controls">
            <button class="btn btn-play" onclick="playLesson()">▶️ 朗讀課文</button>
            <button class="btn btn-pause" onclick="pauseLesson()">⏸️ 暫停</button>
            <button class="btn btn-stop" onclick="stopLesson()">⏹️ 停止</button>
          </div>
        </div>

        <!-- Rendered Lesson Paragraphs Container -->
        <div id="paragraphs-container" class="paragraphs-list">
          <!-- Dynamically populated -->
        </div>
      </article>
    </section>

    <!-- Right Area: Sidebar Vocabulary Lookup -->
    <aside class="sidebar">
      <div class="lookup-panel empty" id="lookup-panel">
        <div id="lookup-prompt">
          <div class="bulb-icon">💡</div>
          <p style="font-weight: 800; font-size: 15px; margin-bottom: 8px;">單字即點即查</p>
          <p style="font-size: 13px; line-height: 1.5; padding: 0 10px;">點擊課文中的任何英文單字，即可在此顯示中文意思、音標 (IPA) 與詞性，還可以聆聽單字發音喔！</p>
        </div>

        <div class="lookup-details" id="lookup-details">
          <div class="lookup-word-header">
            <div class="lookup-word" id="info-word">Apple</div>
            <button class="pronounce-word-btn" onclick="pronounceWord()" title="播放單字讀音">🔊</button>
          </div>

          <div class="lookup-row">
            <span class="lookup-label">音標 (IPA)</span>
            <span class="lookup-ipa" id="info-ipa">[ˈæpl]</span>
          </div>

          <div class="lookup-row">
            <span class="lookup-label">詞性 (POS)</span>
            <span class="lookup-pos" id="info-pos">noun.</span>
          </div>

          <div class="lookup-row">
            <span class="lookup-label">中文翻譯</span>
            <div class="lookup-translation" id="info-zh">蘋果</div>
          </div>

          <button class="btn close-lookup-btn" onclick="closeLookupPanel()">關閉查詢</button>
        </div>
      </div>
    </aside>
  </main>

  <footer class="max-width">
    <p>Super Fun 8 English Interactive Reader &copy; 2026. Made with ❤️ for learning.</p>
  </footer>

    "ipa": "jɔːr",
    "pos": "pron. 代名詞 (所有格)"
  },
  "youtuber": {

    // Application State Variables
    let currentTab = 'lesson1';
    let isPlaying = false;
    let isPaused = false;
    
    // Arrays tracking sentence components
    let lessonSentences = [];
    let currentSentenceIdx = -1;
    let activeUtterance = null;
    let lastSelectedWordSpan = null;

    // Load active voice safely
    let enVoice = null;
    function loadVoice() {
      const voices = window.speechSynthesis.getVoices();
      enVoice = voices.find(v => v.lang === 'en-US') || 
                voices.find(v => v.lang === 'en-GB') || 
                voices.find(v => v.lang.startsWith('en')) || 
                null;
    }
    
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = loadVoice;
    }
    loadVoice();

    // Tokenizer function: wraps alphabetical words in spans, preserving punctuation
    function tokenizeHTML(text) {
      // Regex detects words, including hyphenated ones (add-ons) and contractions (I'm, Wendy's)
      const parts = text.split(/([a-zA-Z']+(?:-[a-zA-Z']+)*)/);
      return parts.map(part => {
        if (/^[a-zA-Z']+(?:-[a-zA-Z']+)*$/.test(part)) {
          const lookupKey = part.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
          return `<span class="word" data-word="${lookupKey}" onclick="wordClicked(event, this)">${part}</span>`;
        }
        return part;
      }).join('');
    }

    // Render the active tab content
    function renderLesson(lessonId) {
      const lesson = LESSON_DATA[lessonId];
      document.getElementById('lesson-title-display').innerHTML = `${lesson.icon} ${lesson.title}`;
      
      const container = document.getElementById('paragraphs-container');
      container.innerHTML = '';
      
      lessonSentences = []; // rebuild sentences array for player tracking
      
      lesson.paragraphs.forEach(para => {
        const paraCard = document.createElement('div');
        paraCard.className = 'paragraph-card';
        
        const engBlock = document.createElement('div');
        engBlock.className = 'english-para';
        
        para.sentences.forEach(sent => {
          // Add to player queue
          lessonSentences.push(sent);
          
          const sentSpan = document.createElement('span');
          sentSpan.className = 'sentence-block';
          sentSpan.id = `sent-block-${sent.id}`;
          
          // Speaker icon for individual reading
          const speakerIcon = document.createElement('span');
          speakerIcon.className = 'play-sentence-icon';
          speakerIcon.innerHTML = '🔊';
          speakerIcon.title = '朗讀此句';
          speakerIcon.onclick = (e) => {
            e.stopPropagation();
            playIndividualSentence(sent);
          };
          
          sentSpan.appendChild(speakerIcon);
          
          // Wrap words in token spans
          const wordContainer = document.createElement('span');
          wordContainer.innerHTML = tokenizeHTML(sent.english) + ' ';
          sentSpan.appendChild(wordContainer);
          
          engBlock.appendChild(sentSpan);
        });
        
        paraCard.appendChild(engBlock);
        
        // Chinese translation block
        const zhBlock = document.createElement('div');
        zhBlock.className = 'chinese-para';
        zhBlock.innerText = para.chineseTranslation;
        paraCard.appendChild(zhBlock);
        
        container.appendChild(paraCard);
      });
    }

    // Tab Switching
    function switchTab(lessonId) {
      if (lessonId === currentTab) return;
      
      // Stop voice output immediately
      stopLesson();
      
      // Toggle tab buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`.tab-btn[data-tab="${lessonId}"]`).classList.add('active');
      
      currentTab = lessonId;
      renderLesson(lessonId);
      closeLookupPanel();
    }

    // Realtime speaking rate display
    function updateSpeedLabel(val) {
      document.getElementById('speed-label').innerText = `${val}x`;
    }

    // Audio highlighting state
    function highlightSentence(sentenceId) {
      document.querySelectorAll('.sentence-block').forEach(block => {
        block.classList.remove('active-sentence');
      });
      const target = document.getElementById(`sent-block-${sentenceId}`);
      if (target) {
        target.classList.add('active-sentence');
        target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // Clear sentence highlighting
    function clearAllHighlights() {
      document.querySelectorAll('.sentence-block').forEach(block => {
        block.classList.remove('active-sentence');
      });
    }

    // TTS Player Functions
    function playLesson() {
      if (isPaused) {
        window.speechSynthesis.resume();
        isPlaying = true;
        isPaused = false;
        return;
      }
      
      stopLesson(); // Reset playback to beginning
      isPlaying = true;
      currentSentenceIdx = 0;
      speakSentenceQueue();
    }

    // Pause
    function pauseLesson() {
      if (isPlaying && !isPaused) {
        window.speechSynthesis.pause();
        isPlaying = false;
        isPaused = true;
      }
    }

    // Stop
    function stopLesson() {
      window.speechSynthesis.cancel();
      isPlaying = false;
      isPaused = false;
      currentSentenceIdx = -1;
      clearAllHighlights();
    }

    function speakSentenceQueue() {
      if (!isPlaying) return;
      if (currentSentenceIdx < 0 || currentSentenceIdx >= lessonSentences.length) {
        stopLesson();
        return;
      }
      
      const sentenceObj = lessonSentences[currentSentenceIdx];
      highlightSentence(sentenceObj.id);
      
      activeUtterance = new SpeechSynthesisUtterance(sentenceObj.english);
      if (enVoice) activeUtterance.voice = enVoice;
      
      // Apply speech rate
      const rateVal = parseFloat(document.getElementById('speed-slider').value);
      activeUtterance.rate = rateVal;
      
      activeUtterance.onend = () => {
        currentSentenceIdx++;
        speakSentenceQueue();
      };
      
      activeUtterance.onerror = (e) => {
        console.error('Speech synthesis error:', e);
        stopLesson();
      };
      
      window.speechSynthesis.speak(activeUtterance);
    }

    // Individual sentence playback
    function playIndividualSentence(sentenceObj) {
      stopLesson();
      
      highlightSentence(sentenceObj.id);
      
      const utter = new SpeechSynthesisUtterance(sentenceObj.english);
      if (enVoice) utter.voice = enVoice;
      utter.rate = parseFloat(document.getElementById('speed-slider').value);
      
      utter.onend = () => {
        clearAllHighlights();
      };
      
      utter.onerror = () => {
        clearAllHighlights();
      };
      
      window.speechSynthesis.speak(utter);
    }

    // Word Lookup Logic
    function wordClicked(event, element) {
      event.stopPropagation();
      
      if (lastSelectedWordSpan) {
        lastSelectedWordSpan.classList.remove('selected-word');
      }
      
      element.classList.add('selected-word');
      lastSelectedWordSpan = element;
      
      const lookupWord = element.getAttribute('data-word');
      showWordDefinition(lookupWord);
    }

    function showWordDefinition(wordKey) {
      const wordObj = WORD_DB[wordKey];
      const panel = document.getElementById('lookup-panel');
      const prompt = document.getElementById('lookup-prompt');
      const details = document.getElementById('lookup-details');
      
      // Load vocabulary definitions
      if (wordObj) {
        document.getElementById('info-word').innerText = wordKey;
        document.getElementById('info-ipa').innerText = `[${wordObj.ipa}]`;
        document.getElementById('info-pos').innerText = wordObj.pos;
        document.getElementById('info-zh').innerText = wordObj.zh;
      } else {
        // Fallback for compound words / special names not fully covered
        document.getElementById('info-word').innerText = wordKey;
        document.getElementById('info-ipa').innerText = '[ - ]';
        document.getElementById('info-pos').innerText = '單字';
        document.getElementById('info-zh').innerText = '點擊發音 (課表外單字)';
      }
      
      // Update UI panels
      prompt.style.display = 'none';
      details.classList.add('active');
      panel.classList.remove('empty');
      
      // Mobile handling
      if (window.innerWidth <= 900) {
        panel.classList.add('mobile-active');
        document.getElementById('backdrop').classList.add('active');
      }
    }

    function closeLookupPanel() {
      const panel = document.getElementById('lookup-panel');
      const prompt = document.getElementById('lookup-prompt');
      const details = document.getElementById('lookup-details');
      
      prompt.style.display = 'block';
      details.classList.remove('active');
      panel.classList.add('empty');
      panel.classList.remove('mobile-active');
      document.getElementById('backdrop').classList.remove('active');
      
      if (lastSelectedWordSpan) {
        lastSelectedWordSpan.classList.remove('selected-word');
        lastSelectedWordSpan = null;
      }
    }

    // Speak single word in lookup
    function pronounceWord() {
      const wordText = document.getElementById('info-word').innerText;
      if (!wordText) return;
      
      // Stop current reading briefly
      window.speechSynthesis.cancel();
      
      const utter = new SpeechSynthesisUtterance(wordText);
      if (enVoice) utter.voice = enVoice;
      utter.rate = parseFloat(document.getElementById('speed-slider').value);
      window.speechSynthesis.speak(utter);
    }

    // Initialization on window load
    window.onload = () => {
      renderLesson('lesson1');
      loadVoice();
    };
  </script>
</body>
