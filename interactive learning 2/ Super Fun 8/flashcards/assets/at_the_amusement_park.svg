<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="220" height="220" rx="30" fill="#E8F5E9" />
  <!-- Smiling Cloud -->
  <path d="M40 50 C40 45 45 40 52 40 C55 40 58 41 60 43 C63 38 70 35 77 38 C83 40 85 45 85 48 C88 48 93 50 94 55 C95 60 90 65 82 65 L48 65 C43 65 40 60 40 50 Z" fill="#FFFFFF"/>
  <circle cx="58" cy="52" r="1.5" fill="#90A4AE"/>
  <circle cx="68" cy="52" r="1.5" fill="#90A4AE"/>
  <path d="M61 56 Q63 58 65 56" fill="none" stroke="#90A4AE" stroke-width="1"/>
  <!-- Ferris Wheel Support Stand -->
  <line x1="110" y1="110" x2="80" y2="195" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="110" x2="140" y2="195" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
  <!-- Main Wheel Circle -->
  <circle cx="110" cy="110" r="50" fill="none" stroke="#90CAF9" stroke-width="3"/>
  <circle cx="110" cy="110" r="30" fill="none" stroke="#90CAF9" stroke-width="1.5"/>
  <!-- Spokes -->
  <line x1="110" y1="60" x2="110" y2="160" stroke="#90CAF9" stroke-width="2"/>
  <line x1="60" y1="110" x2="160" y2="110" stroke="#90CAF9" stroke-width="2"/>
  <line x1="75" y1="75" x2="145" y2="145" stroke="#90CAF9" stroke-width="2"/>
  <line x1="75" y1="145" x2="145" y2="75" stroke="#90CAF9" stroke-width="2"/>
  <!-- Center Hub -->
  <circle cx="110" cy="110" r="10" fill="#FFD54F" stroke="#5D4037" stroke-width="2"/>
  <circle cx="110" cy="110" r="3" fill="#5D4037"/>
  <!-- Cabins / Gondolas -->
  <!-- Top (110, 60) -->
  <rect x="100" y="50" width="20" height="15" rx="3" fill="#FF8A80" stroke="#5D4037" stroke-width="2"/>
  <circle cx="110" cy="57" r="1.5" fill="#5D4037"/>
  <!-- Bottom (110, 160) -->
  <rect x="100" y="155" width="20" height="15" rx="3" fill="#FF8A80" stroke="#5D4037" stroke-width="2"/>
  <circle cx="110" cy="162" r="1.5" fill="#5D4037"/>
  <!-- Left (60, 110) -->
  <rect x="50" y="102" width="20" height="15" rx="3" fill="#A5D6A7" stroke="#5D4037" stroke-width="2"/>
  <circle cx="60" cy="110" r="1.5" fill="#5D4037"/>
  <!-- Right (160, 110) -->
  <rect x="150" y="102" width="20" height="15" rx="3" fill="#A5D6A7" stroke="#5D4037" stroke-width="2"/>
  <circle cx="160" cy="110" r="1.5" fill="#5D4037"/>
  <!-- Top Left (75, 75) -->
  <rect x="65" y="67" width="20" height="15" rx="3" fill="#FFE082" stroke="#5D4037" stroke-width="2"/>
  <circle cx="75" cy="75" r="1.5" fill="#5D4037"/>
  <!-- Top Right (145, 75) -->
  <rect x="135" y="67" width="20" height="15" rx="3" fill="#FFE082" stroke="#5D4037" stroke-width="2"/>
  <circle cx="145" cy="75" r="1.5" fill="#5D4037"/>
  <!-- Bottom Left (75, 145) -->
  <rect x="65" y="137" width="20" height="15" rx="3" fill="#B3E5FC" stroke="#5D4037" stroke-width="2"/>
  <circle cx="75" cy="145" r="1.5" fill="#5D4037"/>
  <!-- Bottom Right (145, 145) -->
  <rect x="135" y="137" width="20" height="15" rx="3" fill="#B3E5FC" stroke="#5D4037" stroke-width="2"/>
  <circle cx="145" cy="145" r="1.5" fill="#5D4037"/>
</svg>
