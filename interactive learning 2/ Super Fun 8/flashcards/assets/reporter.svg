      <stop offset="0%" stop-color="#E2F0D9" />
      <stop offset="100%" stop-color="#D0E9E3" />
    </linearGradient>
  </defs>
  <rect width="220" height="220" rx="30" fill="url(#bg)" />
  <!-- Microphone -->
  <rect x="75" y="105" width="12" height="60" rx="6" fill="#333333" />
  <rect x="68" y="90" width="26" height="15" rx="3" fill="#FF4D4D" />
