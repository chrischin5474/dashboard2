<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="220" height="220" rx="30" fill="#F0F4C3" />
  <!-- Ground -->
  <path d="M-10 185 Q110 175 230 185 L230 220 L-10 220 Z" fill="#DCEDC8"/>
  <!-- School Main Building -->
  <rect x="50" y="90" width="120" height="90" rx="10" fill="#FFCCBC" stroke="#5D4037" stroke-width="3"/>
  <!-- Entrance/Middle section -->
  <rect x="90" y="80" width="40" height="100" fill="#FFB74D" stroke="#5D4037" stroke-width="3"/>
  <polygon points="85,80 110,50 135,80" fill="#E57373" stroke="#5D4037" stroke-width="3" stroke-linejoin="round"/>
  <!-- Clock -->
  <circle cx="110" cy="95" r="12" fill="#FFFFFF" stroke="#5D4037" stroke-width="2"/>
  <line x1="110" y1="95" x2="110" y2="90" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="110" y1="95" x2="115" y2="95" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Windows -->
  <rect x="62" y="110" width="18" height="20" rx="4" fill="#B3E5FC" stroke="#5D4037" stroke-width="2"/>
  <rect x="140" y="110" width="18" height="20" rx="4" fill="#B3E5FC" stroke="#5D4037" stroke-width="2"/>
  <rect x="62" y="140" width="18" height="20" rx="4" fill="#B3E5FC" stroke="#5D4037" stroke-width="2"/>
  <rect x="140" y="140" width="18" height="20" rx="4" fill="#B3E5FC" stroke="#5D4037" stroke-width="2"/>
  <!-- Door -->
  <rect x="100" y="145" width="20" height="35" rx="3" fill="#D7CCC8" stroke="#5D4037" stroke-width="2"/>
  <!-- Cute Face on Middle Section -->
  <circle cx="105" cy="120" r="2" fill="#5D4037"/>
  <circle cx="115" cy="120" r="2" fill="#5D4037"/>
  <path d="M108 124 Q110 126 112 124" fill="none" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cute flag -->
  <line x1="110" y1="50" x2="110" y2="35" stroke="#5D4037" stroke-width="2"/>
  <polygon points="110,35 125,40 110,45" fill="#FF1744"/>
</svg>
